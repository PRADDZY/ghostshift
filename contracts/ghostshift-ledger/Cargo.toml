[package]
name = "ghostshift-ledger"
version = "0.1.0"
edition = "2021"

[lib]
name = "ghostshift_ledger"
crate-type = ["cdylib"]

[dependencies]
casper-contract = { version = "5.1.1", default-features = false }
casper-types = "6.0.1"
base64ct = "=1.7.2"
dlmalloc = { version = "=0.2.6", features = ["global"] }
zeroize = "=1.8.1"

[profile.release]
lto = true
codegen-units = 1
opt-level = "z"
